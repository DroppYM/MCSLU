<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Proxy API</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        code { background: #000; padding: 5px; color: #00ff00; }
        input { padding: 10px; border-radius: 5px; border: none; width: 60%; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #5865F2; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Skin Proxy Service</h1>
        <p>This API fetches skins from <b>Ely.by</b>, <b>Mojang</b>, and <b>TLauncher</b>.</p>
        <hr>
        <h3>Test the API</h3>
        <input type="text" id="username" placeholder="Enter Minecraft Username">
        <button onclick="test()">View JSON</button>
        <p>API Root: <code>/api/v1/user/{username}.json</code></p>
    </div>

    <script>
        function test() {
            const user = document.getElementById('username').value;
            if (user) window.location.href = `/api/v1/user/${user}.json`;
        }
    </script>
</body>
</html>
